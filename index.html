<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💠 Pattern Generator | ElijahAmogsus</title>
  <style>
    :root {
      --base: #1e1e2e; --mantle: #181825; --surface0: #313244;
      --surface1: #45475a; --text: #cdd6f4; --subtext0: #a6adc8;
      --accent: #89b4fa;
    }

    * { box-sizing: border-box; transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }

    html, body {
      margin: 0; padding: 0; min-height: 100vh; width: 100%;
      background-color: var(--base); color: var(--text); font-family: monospace;
    }

    body { display: flex; flex-direction: column; align-items: center; padding: 26px 14px; }

    .back-link { color: var(--accent); text-decoration: none; font-weight: bold; margin-top: 24px; display: inline-block; }
    .back-link:hover { text-decoration: underline; }

    .theme-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; align-items: center; }

    .theme-btn, .accent-select, .ctrl-btn, .ctrl-select {
      background-color: var(--mantle); color: var(--text); border: 2px solid var(--surface1);
      border-radius: 6px; padding: 6px 11px; font-family: monospace; font-weight: bold; cursor: pointer;
    }

    .theme-btn:hover, .theme-btn.active, .accent-select:hover, .accent-select:focus,
    .ctrl-btn:hover, .ctrl-btn.active, .ctrl-select:hover, .ctrl-select:focus {
      border-color: var(--accent); background-color: var(--surface0); outline: none;
    }

    h1 { color: var(--accent); margin: 0 0 6px 0; font-size: clamp(1.5rem, 6vw, 2rem); text-align: center; }
    p { color: var(--subtext0); margin: 0 0 20px 0; text-align: center; }

    .workspace {
      width: 100%; max-width: 920px; display: grid;
      grid-template-columns: 1fr 315px; gap: 16px; align-items: start;
    }

    .card {
      background-color: var(--mantle); border: 2px solid var(--surface1);
      border-radius: 10px; padding: 16px;
    }

    .card h3 { color: var(--accent); margin: 0 0 10px 0; font-size: 0.98rem; }

    .preview-wrap {
      width: 100%; aspect-ratio: 4 / 3; max-height: 460px;
      border: 2px solid var(--surface1); border-radius: 8px; overflow: hidden;
      background-color: var(--base);
    }

    canvas#patternCanvas { width: 100%; height: 100%; display: block; }

    .pattern-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }

    .color-pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; margin-bottom: 10px; }
    .color-box {
      display: flex; flex-direction: column; gap: 5px;
      background-color: var(--base); border: 2px solid var(--surface1);
      border-radius: 6px; padding: 8px;
    }
    .color-box label { color: var(--subtext0); font-size: 0.8rem; font-weight: bold; }
    .color-inner { display: flex; align-items: center; gap: 6px; }

    input[type="color"] {
      width: 34px; height: 28px; border: 2px solid var(--surface1);
      border-radius: 5px; background: transparent; cursor: pointer; padding: 1px;
    }

    .slider-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .slider-group label { color: var(--subtext0); font-size: 0.88rem; font-weight: bold; display: flex; justify-content: space-between; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

    .export-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .primary-btn {
      flex: 1; min-width: 110px; background-color: var(--accent); color: var(--base);
      border: 2px solid var(--accent); border-radius: 6px; padding: 8px 10px;
      font-family: monospace; font-weight: bold; cursor: pointer;
    }
    .primary-btn:hover { opacity: 0.92; }

    .status-msg { color: var(--subtext0); font-size: 0.82rem; min-height: 18px; text-align: center; }

    @media (max-width: 780px) { .workspace { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="theme-bar">
    <button class="theme-btn active" onclick="setTheme('mocha')">🌿 Mocha</button>
    <button class="theme-btn" onclick="setTheme('macchiato')">🌺 Macchiato</button>
    <button class="theme-btn" onclick="setTheme('frappe')">🪴 Frappé</button>
    <button class="theme-btn" onclick="setTheme('latte')">🌻 Latte</button>
    <select id="accentSelect" class="accent-select" onchange="setAccent(this.value)" aria-label="Accent Color">
      <option value="rosewater">🌸 Rosewater</option>
      <option value="flamingo">🦩 Flamingo</option>
      <option value="pink">💖 Pink</option>
      <option value="mauve">🔮 Mauve</option>
      <option value="red">🍎 Red</option>
      <option value="maroon">🍒 Maroon</option>
      <option value="peach">🍑 Peach</option>
      <option value="yellow">🍋 Yellow</option>
      <option value="green">🍏 Green</option>
      <option value="teal">🌊 Teal</option>
      <option value="sky">☁️ Sky</option>
      <option value="sapphire">💎 Sapphire</option>
      <option value="blue" selected>💙 Blue</option>
      <option value="lavender">🪻 Lavender</option>
    </select>
  </div>

  <h1>💠 Pattern Generator</h1>
  <p>Design seamless geometric backgrounds with custom Primary & Secondary colors</p>

  <div class="workspace">
    <div class="card">
      <h3>Live Preview (800×600)</h3>
      <div class="preview-wrap">
        <canvas id="patternCanvas" width="800" height="600"></canvas>
      </div>
    </div>

    <div class="card">
      <h3>Pattern Style</h3>
      <div class="pattern-grid" id="patternBtns">
        <button class="ctrl-btn active" data-pat="checker">🏁 Checker</button>
        <button class="ctrl-btn" data-pat="stripes">📏 Stripes</button>
        <button class="ctrl-btn" data-pat="dots">⚪ Polka Dots</button>
        <button class="ctrl-btn" data-pat="grid">🕸️ Pixel Grid</button>
        <button class="ctrl-btn" data-pat="chevron">〰️ Chevron</button>
        <button class="ctrl-btn" data-pat="diamonds">🔷 Diamonds</button>
        <button class="ctrl-btn" data-pat="hex">⬡ Hexagons</button>
        <button class="ctrl-btn" data-pat="bricks">🧱 Bricks</button>
      </div>

      <h3>Primary & Secondary Colors</h3>
      <div class="color-pair">
        <div class="color-box">
          <label for="primaryColor">Primary</label>
          <div class="color-inner">
            <input type="color" id="primaryColor" value="#89b4fa">
            <span id="priHex" style="font-size:0.82rem;font-weight:bold;">#89b4fa</span>
          </div>
        </div>
        <button class="ctrl-btn" onclick="swapColors()" title="Swap Primary & Secondary">⇄</button>
        <div class="color-box">
          <label for="secondaryColor">Secondary</label>
          <div class="color-inner">
            <input type="color" id="secondaryColor" value="#1e1e2e">
            <span id="secHex" style="font-size:0.82rem;font-weight:bold;">#1e1e2e</span>
          </div>
        </div>
      </div>
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <button class="ctrl-btn" style="flex:1;" onclick="syncThemeColors()">🎨 Sync Theme</button>
        <button class="ctrl-btn" style="flex:1;" onclick="randomColors()">🎲 Random</button>
      </div>

      <h3>Adjustments</h3>
      <div class="slider-group">
        <label for="sizeSlider"><span>Tile Size</span><span id="sizeVal">40px</span></label>
        <input type="range" id="sizeSlider" min="12" max="120" value="40">
      </div>
      <div class="slider-group">
        <label for="weightSlider"><span>Thickness / Radius</span><span id="weightVal">50%</span></label>
        <input type="range" id="weightSlider" min="10" max="90" value="50">
      </div>
      <div class="slider-group">
        <label for="angleSlider"><span>Rotation Angle</span><span id="angleVal">0°</span></label>
        <input type="range" id="angleSlider" min="0" max="360" value="0">
      </div>

      <h3>Export & Copy</h3>
      <div class="export-row">
        <select id="exportScope" class="ctrl-select" aria-label="Export Scope">
          <option value="full" selected>Full (800×600)</option>
          <option value="tile">Single Tile</option>
        </select>
        <select id="exportFormat" class="ctrl-select" aria-label="Export Format">
          <option value="png" selected>PNG</option>
          <option value="webp">WEBP</option>
          <option value="jpg">JPG</option>
          <option value="bmp">BMP</option>
          <option value="svg">SVG</option>
        </select>
        <button class="primary-btn" onclick="downloadPattern()">⬇️ Download</button>
      </div>
      <button class="ctrl-btn" style="width:100%; margin-bottom:6px;" onclick="copyCSS()">📋 Copy CSS Background</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

  <a href="/" class="back-link">← Back to Dev Hub</a>
    <script>
    const themes = {
      mocha: {
        base: '#1e1e2e', mantle: '#181825', surface0: '#313244', surface1: '#45475a', text: '#cdd6f4', subtext0: '#a6adc8',
        accents: { rosewater: '#f5e0dc', flamingo: '#f2cdcd', pink: '#f5c2e7', mauve: '#cba6f7', red: '#f38ba8', maroon: '#eba0ac', peach: '#fab387', yellow: '#f9e2af', green: '#a6e3a1', teal: '#94e2d5', sky: '#89dceb', sapphire: '#74c7ec', blue: '#89b4fa', lavender: '#b4befe' }
      },
      macchiato: {
        base: '#24273a', mantle: '#1e2030', surface0: '#363a4f', surface1: '#494d64', text: '#cad3f5', subtext0: '#a5adcb',
        accents: { rosewater: '#f4dbd6', flamingo: '#f0c6c6', pink: '#f5bde6', mauve: '#c6a0f6', red: '#ed8796', maroon: '#ee99a0', peach: '#f5a97f', yellow: '#eed49f', green: '#a6da95', teal: '#8bd5ca', sky: '#91d7e3', sapphire: '#7dc4e4', blue: '#8aadf4', lavender: '#b7bdf8' }
      },
      frappe: {
        base: '#303446', mantle: '#292c3c', surface0: '#414559', surface1: '#51576d', text: '#c6d0f5', subtext0: '#a5adce',
        accents: { rosewater: '#f2d5cf', flamingo: '#eebebe', pink: '#f4b8e4', mauve: '#ca9ee6', red: '#e78284', maroon: '#ea999c', peach: '#ef9f76', yellow: '#e5c890', green: '#a6d189', teal: '#81c8be', sky: '#99d1db', sapphire: '#85c1dc', blue: '#8caaee', lavender: '#babbf1' }
      },
      latte: {
        base: '#eff1f5', mantle: '#e6e9ef', surface0: '#ccd0da', surface1: '#bcc0cc', text: '#4c4f69', subtext0: '#6c6f85',
        accents: { rosewater: '#dc8a78', flamingo: '#dd7878', pink: '#ea76cb', mauve: '#8839ef', red: '#d20f39', maroon: '#e64553', peach: '#fe640b', yellow: '#df8e1d', green: '#40a02b', teal: '#179299', sky: '#04a5e5', sapphire: '#209fb5', blue: '#1e66f5', lavender: '#7287fd' }
      }
    };

    let currentTheme = localStorage.getItem('catppuccin-theme') || 'mocha';
    let currentAccent = localStorage.getItem('catppuccin-accent') || 'blue';

    function applyPalette() {
      const p = themes[currentTheme] || themes.mocha;
      const root = document.documentElement.style;
      for (const [k, v] of Object.entries(p)) {
        if (k !== 'accents') root.setProperty('--' + k, v);
      }
      root.setProperty('--accent', p.accents[currentAccent] || p.accents.blue);
      document.querySelectorAll('.theme-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('onclick').includes("'" + currentTheme + "'"));
      });
      document.getElementById('accentSelect').value = currentAccent;
    }

    function setTheme(name) { currentTheme = name; localStorage.setItem('catppuccin-theme', name); applyPalette(); }
    function setAccent(accent) { currentAccent = accent; localStorage.setItem('catppuccin-accent', accent); applyPalette(); }
    applyPalette();

    const canvas = document.getElementById('patternCanvas');
    const ctx = canvas.getContext('2d');
    const primaryInput = document.getElementById('primaryColor');
    const secondaryInput = document.getElementById('secondaryColor');
    const priHex = document.getElementById('priHex');
    const secHex = document.getElementById('secHex');
    const sizeSlider = document.getElementById('sizeSlider');
    const weightSlider = document.getElementById('weightSlider');
    const angleSlider = document.getElementById('angleSlider');
    const statusMsg = document.getElementById('statusMsg');

    let currentPattern = 'checker';

    function buildTileCanvas() {
      const size = parseInt(sizeSlider.value, 10);
      const weight = parseInt(weightSlider.value, 10) / 100;
      const pri = primaryInput.value;
      const sec = secondaryInput.value;

      const tile = document.createElement('canvas');
      const tctx = tile.getContext('2d');

      if (currentPattern === 'checker') {
        tile.width = size * 2;
        tile.height = size * 2;
        tctx.fillStyle = sec;
        tctx.fillRect(0, 0, tile.width, tile.height);
        tctx.fillStyle = pri;
        tctx.fillRect(0, 0, size, size);
        tctx.fillRect(size, size, size, size);
      } else if (currentPattern === 'stripes') {
        tile.width = size;
        tile.height = size;
        tctx.fillStyle = sec;
        tctx.fillRect(0, 0, size, size);
        tctx.fillStyle = pri;
        tctx.fillRect(0, 0, size * weight, size);
      } else if (currentPattern === 'dots') {
        tile.width = size * 2;
        tile.height = size * 2;
        tctx.fillStyle = sec;
        tctx.fillRect(0, 0, tile.width, tile.height);
        tctx.fillStyle = pri;
        const r = Math.max(2, (size * 0.45) * weight);
        const centers = Array.of({ x: size * 0.5, y: size * 0.5 }, { x: size * 1.5, y: size * 1.5 });
        for (let i = 0; i < centers.length; i++) {
          const c = centers.at(i);
          tctx.beginPath();
          tctx.arc(c.x, c.y, r, 0, Math.PI * 2);
          tctx.fill();
        }
      } else if (currentPattern === 'grid') {
        tile.width = size;
        tile.height = size;
        tctx.fillStyle = sec;
        tctx.fillRect(0, 0, size, size);
        tctx.strokeStyle = pri;
        tctx.lineWidth = Math.max(1, size * 0.25 * weight);
        tctx.strokeRect(0, 0, size, size);
      } else if (currentPattern === 'chevron') {
        tile.width = size * 2;
        tile.height = size;
        tctx.fillStyle = sec;
        tctx.fillRect(0, 0, tile.width, tile.height);
        tctx.strokeStyle = pri;
        tctx.lineWidth = Math.max(2, size * 0.45 * weight);
        tctx.lineCap = 'square';
        for (let offsetY = -size; offsetY <= size; offsetY += size) {
          tctx.beginPath();
          tctx.moveTo(0, offsetY + size * 0.75);
          tctx.lineTo(size, offsetY + size * 0.25);
          tctx.lineTo(size * 2, offsetY + size * 0.75);
          tctx.stroke();
        }
      } else if (currentPattern === 'diamonds') {
        tile.width = size;
        tile.height = size;
        tctx.fillStyle = sec;
        tctx.fillRect(0, 0, size, size);
        tctx.fillStyle = pri;
        const half = (size * 0.5) * (0.4 + weight * 0.6);
        const mid = size * 0.5;
        tctx.beginPath();
        tctx.moveTo(mid, mid - half);
        tctx.lineTo(mid + half, mid);
        tctx.lineTo(mid, mid + half);
        tctx.lineTo(mid - half, mid);
        tctx.closePath();
        tctx.fill();
            } else if (currentPattern === 'hex') {
        const r = size * 0.5;
        const hexH = Math.round(r * Math.sqrt(3));
        tile.width = Math.round(r * 3);
        tile.height = Math.max(12, hexH * 2);
        tctx.fillStyle = sec;
        tctx.fillRect(0, 0, tile.width, tile.height);
        tctx.strokeStyle = pri;
        tctx.lineWidth = Math.max(1.5, size * 0.22 * weight);
        tctx.lineJoin = 'round';
        const drawHex = (cx, cy) => {
          tctx.beginPath();
          for (let a = 0; a < 6; a++) {
            const ang = (Math.PI / 3) * a;
            const px = cx + r * Math.cos(ang);
            const py = cy + r * Math.sin(ang);
            if (a === 0) tctx.moveTo(px, py);
            else tctx.lineTo(px, py);
          }
          tctx.closePath();
          tctx.stroke();
        };
        const dx = tile.width * 0.5;
        const dy = tile.height * 0.5;
        drawHex(0, 0);
        drawHex(tile.width, 0);
        drawHex(0, tile.height);
        drawHex(tile.width, tile.height);
        drawHex(dx, dy);
      } else if (currentPattern === 'bricks') {
        tile.width = size * 2;
        tile.height = size;
        tctx.fillStyle = pri;
        tctx.fillRect(0, 0, tile.width, tile.height);
        const mortar = Math.max(2, Math.round(size * 0.22 * weight));
        const halfH = size * 0.5;
        tctx.fillStyle = sec;
        tctx.fillRect(mortar * 0.5, mortar * 0.5, size * 2 - mortar, halfH - mortar);
        tctx.fillRect(mortar * 0.5, halfH + mortar * 0.5, size - mortar, halfH - mortar);
        tctx.fillRect(size + mortar * 0.5, halfH + mortar * 0.5, size - mortar, halfH - mortar);
      }

      return tile;
    }    function renderPattern() {
      const tile = buildTileCanvas();
      const angleDeg = parseInt(angleSlider.value, 10);
      const rad = (angleDeg * Math.PI) / 180;

      ctx.save();
      ctx.fillStyle = secondaryInput.value;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const pat = ctx.createPattern(tile, 'repeat');
      if (pat && typeof pat.setTransform === 'function') {
        const matrix = new DOMMatrix();
        matrix.translateSelf(canvas.width * 0.5, canvas.height * 0.5);
        matrix.rotateSelf(angleDeg);
        matrix.translateSelf(-canvas.width * 0.5, -canvas.height * 0.5);
        pat.setTransform(matrix);
        ctx.fillStyle = pat;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else if (pat) {
        ctx.translate(canvas.width * 0.5, canvas.height * 0.5);
        ctx.rotate(rad);
        ctx.fillStyle = pat;
        ctx.fillRect(-1000, -1000, 2000, 2000);
      }
      ctx.restore();
    }

    function updateLabels() {
      priHex.textContent = primaryInput.value.toLowerCase();
      secHex.textContent = secondaryInput.value.toLowerCase();
      document.getElementById('sizeVal').textContent = sizeSlider.value + 'px';
      document.getElementById('weightVal').textContent = weightSlider.value + '%';
      document.getElementById('angleVal').textContent = angleSlider.value + '°';
    }

    function swapColors() {
      const temp = primaryInput.value;
      primaryInput.value = secondaryInput.value;
      secondaryInput.value = temp;
      updateLabels();
      renderPattern();
    }

    function syncThemeColors() {
      const p = themes[currentTheme] || themes.mocha;
      primaryInput.value = p.accents[currentAccent] || p.accents.blue;
      secondaryInput.value = p.base;
      updateLabels();
      renderPattern();
      statusMsg.textContent = '🎨 Synced with Catppuccin theme!';
    }

    function randomColors() {
      const randHex = () => '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      primaryInput.value = randHex();
      secondaryInput.value = randHex();
      updateLabels();
      renderPattern();
    }

    document.querySelectorAll('#patternBtns .ctrl-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentPattern = btn.dataset.pat;
        document.querySelectorAll('#patternBtns .ctrl-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderPattern();
      });
    });

    primaryInput.addEventListener('input', () => { updateLabels(); renderPattern(); });
    secondaryInput.addEventListener('input', () => { updateLabels(); renderPattern(); });
    sizeSlider.addEventListener('input', () => { updateLabels(); renderPattern(); });
    weightSlider.addEventListener('input', () => { updateLabels(); renderPattern(); });
    angleSlider.addEventListener('input', () => { updateLabels(); renderPattern(); });

    function encodeBMP(cnv) {
      const c = cnv.getContext('2d');
      const w = cnv.width;
      const h = cnv.height;
      const imgData = c.getImageData(0, 0, w, h).data;
      const rowSize = Math.floor((24 * w + 31) / 32) * 4;
      const pixelArraySize = rowSize * h;
      const fileSize = 54 + pixelArraySize;
      const buffer = new ArrayBuffer(fileSize);
      const view = new DataView(buffer);

      view.setUint16(0, 0x424d, false);
      view.setUint32(2, fileSize, true);
      view.setUint32(10, 54, true);
      view.setUint32(14, 40, true);
      view.setInt32(18, w, true);
      view.setInt32(22, h, true);
      view.setUint16(26, 1, true);
      view.setUint16(28, 24, true);
      view.setUint32(34, pixelArraySize, true);

      let offset = 54;
      for (let y = h - 1; y >= 0; y--) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          view.setUint8(offset++, imgData.at(i + 2));
          view.setUint8(offset++, imgData.at(i + 1));
          view.setUint8(offset++, imgData.at(i));
        }
        while ((offset - 54) % rowSize !== 0) view.setUint8(offset++, 0);
      }
      return new Blob(Array.of(buffer), { type: 'image/bmp' });
    }

    async function downloadPattern() {
      const scope = document.getElementById('exportScope').value;
      const fmt = document.getElementById('exportFormat').value;
      const targetCanvas = scope === 'tile' ? buildTileCanvas() : canvas;
      const filename = 'pattern-' + currentPattern + '-' + scope + '.' + fmt;

      let blob;
      if (fmt === 'svg') {
        const w = targetCanvas.width;
        const h = targetCanvas.height;
        const dataUrl = targetCanvas.toDataURL('image/png');
        const svg = '<svg xmlns="http://w3.org" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '"><image href="' + dataUrl + '" width="' + w + '" height="' + h + '"/></svg>';
        blob = new Blob(Array.of(svg), { type: 'image/svg+xml' });
      } else if (fmt === 'bmp') {
        blob = encodeBMP(targetCanvas);
      } else if (fmt === 'jpg') {
        blob = await new Promise(res => targetCanvas.toBlob(res, 'image/jpeg', 0.95));
      } else if (fmt === 'webp') {
        blob = await new Promise(res => targetCanvas.toBlob(res, 'image/webp', 0.95));
      } else {
        blob = await new Promise(res => targetCanvas.toBlob(res, 'image/png'));
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      statusMsg.textContent = '⬇️ Downloaded ' + filename;
    }

    async function copyCSS() {
      const tile = buildTileCanvas();
      const dataUrl = tile.toDataURL('image/png');
      const css = 'background-image: url("' + dataUrl + '");\nbackground-repeat: repeat;\nbackground-size: ' + tile.width + 'px ' + tile.height + 'px;';
      try {
        await navigator.clipboard.writeText(css);
        statusMsg.textContent = '📋 Copied seamless CSS background-image!';
      } catch (e) {
        statusMsg.textContent = '⚠️ Clipboard blocked—use Download Tile instead.';
      }
    }

    updateLabels();
    renderPattern();
  </script>
